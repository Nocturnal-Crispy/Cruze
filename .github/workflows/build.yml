name: Build

# Every push and PR gets tested and built, so a merge can never be the first
# time the project is compiled.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        # The live-service tests skip themselves without network rather than failing,
        # so this stays green on a runner with restricted egress.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        # Only the release variant runs lintVitalRelease, so without this a fatal
        # lint error reaches main and fails release.yml instead of the PR.
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
